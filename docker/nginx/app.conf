# Availability: beberapa instance PHP-FPM di belakang satu Nginx.
# - "resolve" + resolver Docker: IP container yang berubah setelah restart
#   tetap terdeteksi, dan Nginx tetap bisa start walau satu instance mati.
# - max_fails/fail_timeout: instance yang gagal dikeluarkan sementara
#   (passive health check), lalu dicoba lagi otomatis.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream php_backend {
    zone php_backend 64k;
    server app1:9000 resolve max_fails=1 fail_timeout=10s;
    server app2:9000 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;

    # Responsiveness: kompres respons teks (HTML/CSS/JS/JSON/SVG).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Laravel (SecurityHeaders middleware) juga mengirim header ini; versi
    # dari PHP disembunyikan di blok .php agar tidak terkirim dobel.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_backend;
        # Instance error/mati -> request dialihkan ke instance lain. Nginx
        # tidak mengulang request non-idempoten (POST) yang sudah terkirim,
        # jadi tidak ada risiko data tersimpan dobel.
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_next_upstream_tries 2;
        fastcgi_connect_timeout 1s;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 180;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
    }

    # Semua instance PHP mati -> halaman statis ramah, bukan "502 Bad Gateway".
    error_page 502 504 /fallback.html;
    location = /fallback.html {
        root /usr/share/nginx/fallback;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "20" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Foto yang diupload (destinasi, dll). Disajikan langsung dari volume
    # storage, karena link public/storage hanya dibuat di container PHP.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Aset hasil Vite punya hash di nama file, jadi aman di-cache selamanya.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2)$ {
        expires 7d;
        access_log off;
    }
}
