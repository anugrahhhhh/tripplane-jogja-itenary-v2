<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <!-- Disajikan langsung oleh Nginx bila semua instance aplikasi tidak menjawab. -->
    <meta http-equiv="refresh" content="20">
    <title>Sebentar lagi kembali — JogjaTrip</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: #FBF8F2; color: #1C2B26; }
        main { max-width: 440px; text-align: center; background: #fff; border-radius: 24px;
               padding: 40px 32px; box-shadow: 0 10px 30px -12px rgba(47,107,90,.25);
               border: 1px solid #D4E5DF; }
        .logo { font-weight: 800; font-size: 22px; color: #2F6B5A; letter-spacing: -.02em; }
        h1 { font-size: 22px; margin: 20px 0 8px; }
        p { color: rgba(28,43,38,.7); line-height: 1.6; margin: 0 0 8px; font-size: 15px; }
        .hint { font-size: 13px; color: rgba(28,43,38,.5); margin-top: 16px; }
        button { margin-top: 20px; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600;
                 font-size: 14px; background: #2F6B5A; color: #fff; cursor: pointer; }
        button:focus-visible { outline: 3px solid #A9CBBF; outline-offset: 2px; }
    </style>
</head>
<body>
<main role="main">
    <div class="logo">JogjaTrip</div>
    <h1>Kami sedang memulihkan layanan</h1>
    <p>Server aplikasi sedang tidak bisa dihubungi untuk sementara. Data perjalananmu aman.</p>
    <p>Halaman ini akan mencoba memuat ulang otomatis setiap 20 detik.</p>
    <button type="button" onclick="location.reload()">Coba sekarang</button>
    <p class="hint">Kode: 502/504</p>
</main>
</body>
</html>
